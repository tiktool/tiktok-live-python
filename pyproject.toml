[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiktok-live-api"
version = "1.8.6"
description = "TikTok LIVE API for Python: real-time WebSocket chat, gifts, likes, viewers and battles. Managed signing, no sign server. Async and typed."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "TikTool", email = "support@tik.tools"}
]
keywords = [
    "tiktok",
    "tiktok-live",
    "tiktok-api",
    "tiktok-live-api",
    "tiktok-live-connector",
    "tiktok-live-sdk",
    "tiktok-live-python",
    "tiktok-websocket",
    "tiktok-chat",
    "tiktok-gifts",
    "tiktok-bot",
    "tiktok-events",
    "tiktok-data",
    "tiktok-stream",
    "tiktok-scraper",
    "tiktok-agency",
    "tiktok-overlay",
    "tiktok-live-overlay",
    "tiktok-leaderboard",
    "tiktok-rankings",
    "tiktok-gaming-ranks",
    "tiktok-creator-recruiting",
    "webcast",
    "websocket",
    "real-time",
    "live-streaming",
    "live-chat",
    "unreal-engine",
    "agency",
    "leaderboard",
    "euler-stream",
    "tiktok-tools"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Communications :: Chat",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "websockets>=11.0",
]

[project.urls]
Homepage = "https://tik.tools"
Documentation = "https://tik.tools/docs"
Repository = "https://github.com/tiktool/tiktok-live-python"
Issues = "https://github.com/tiktool/tiktok-live-python/issues"
Changelog = "https://github.com/tiktool/tiktok-live-python/releases"

[tool.hatch.build.targets.wheel]
packages = ["tiktok_live_api"]
